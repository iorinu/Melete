<?xml version="1.0" encoding="UTF-8"?>
<!-- Melete アプリアイコン G-1「緋燼」（Fold 折面）の単体ソース -->
<!-- docs/prototypes/melete-icon-options.html の symbol#g1 と、それが参照する g1-* の defs をそのまま抜き出したもの -->
<!-- 角丸の外側（100px 分の余白）は透明のまま残す。macOS アイコンの標準的な余白に合わせるため -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <path id="g1-sq" d="M100,380 C100,166 166,100 380,100 H644 C858,100 924,166 924,380 V644 C924,858 858,924 644,924 H380 C166,924 100,858 100,644 Z"/>
    <filter id="g1-icon-shadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="g1-drop" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="11" flood-color="#000" flood-opacity=".55"/></filter>
    <filter id="g1-drop-s" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity=".45"/></filter>
    <!-- 帯の形だけを使ってぼかした色光を作る（形そのものは変えず、背後に滲ませるだけ） -->
    <filter id="g1-aura" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="26" result="b"/>
      <feFlood flood-color="#c2141f" flood-opacity=".5"/>
      <feComposite in2="b" operator="in"/>
    </filter>
    <linearGradient id="g1-gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".09"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="g1-rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd9cf" stop-opacity=".42"/><stop offset=".35" stop-color="#ffd9cf" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".3"/></linearGradient>
    <radialGradient id="g1-glow" cx=".26" cy=".16" r=".75"><stop offset="0" stop-color="#ffe6dd" stop-opacity=".08"/><stop offset="1" stop-color="#ffe6dd" stop-opacity="0"/></radialGradient>
    <radialGradient id="g1-core" cx=".6" cy=".66" r=".55"><stop offset="0" stop-color="#8e1422" stop-opacity=".34"/><stop offset=".55" stop-color="#8e1422" stop-opacity=".12"/><stop offset="1" stop-color="#8e1422" stop-opacity="0"/></radialGradient>
    <linearGradient id="g1-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2d2024"/><stop offset=".6" stop-color="#151012"/><stop offset="1" stop-color="#080506"/></linearGradient>
    <linearGradient id="g1-light" gradientUnits="userSpaceOnUse" x1="250" y1="290" x2="700" y2="740"><stop offset="0" stop-color="#f4ece8"/><stop offset="1" stop-color="#ab9b96"/></linearGradient>
    <linearGradient id="g1-accent" gradientUnits="userSpaceOnUse" x1="324" y1="284" x2="774" y2="734"><stop offset="0" stop-color="#df5139"/><stop offset=".5" stop-color="#a8192a"/><stop offset="1" stop-color="#701020"/></linearGradient>
    <g id="g1-band-b">
      <path fill="url(#g1-accent)" d="M324,320 L420,284 L420,628 L774,628 L740,724 L324,724 Z"/>
      <path fill="#140005" opacity=".28" d="M420,628 L774,628 L740,724 L324,724 Z"/>
      <path fill="#ffb89a" opacity=".5" d="M324,320 L420,284 L422,286 L326,322 Z"/>
    </g>
    <clipPath id="g1-clip-cross"><rect x="580" y="600" width="120" height="160"/></clipPath>
  </defs>
  <use href="#g1-sq" xlink:href="#g1-sq" fill="#000" opacity=".5" transform="translate(0 12)" filter="url(#g1-icon-shadow)"/>
  <use href="#g1-sq" xlink:href="#g1-sq" fill="url(#g1-bg)"/>
  <use href="#g1-sq" xlink:href="#g1-sq" fill="url(#g1-glow)"/>
  <use href="#g1-sq" xlink:href="#g1-sq" fill="url(#g1-core)"/>
  <use href="#g1-band-b" xlink:href="#g1-band-b" filter="url(#g1-aura)"/>
  <g filter="url(#g1-drop)"><use href="#g1-band-b" xlink:href="#g1-band-b"/></g>
  <g filter="url(#g1-drop)">
    <path fill="url(#g1-light)" d="M250,300 L700,300 L700,740 L580,700 L580,420 L290,420 Z"/>
    <path fill="#2a0a10" opacity=".2" d="M580,420 L700,300 L700,740 L580,700 Z"/>
    <path fill="#fff" opacity=".55" d="M250,300 L700,300 L698,304 L251.3,304 Z"/>
  </g>
  <g filter="url(#g1-drop-s)"><use href="#g1-band-b" xlink:href="#g1-band-b" clip-path="url(#g1-clip-cross)"/></g>
  <use href="#g1-sq" xlink:href="#g1-sq" fill="url(#g1-gloss)"/>
  <use href="#g1-sq" xlink:href="#g1-sq" fill="none" stroke="url(#g1-rim)" stroke-width="4"/>
</svg>
