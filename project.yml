name: Melete
options:
  bundleIdPrefix: jp.iorinu
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    PRODUCT_BUNDLE_IDENTIFIER: jp.iorinu.Melete
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Melete
  configs:
    ScratchProbe:
      # scratch隔離領域を許可するのはこの検証ビルドだけ（コンパイル時の明示オプトイン）
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG MELETE_SCRATCH_ISOLATION
configs:
  Debug: debug
  Release: release
  WindowProbe: debug
  ScratchProbe: debug
packages:
  # JOSE（JWS/JWE/JWK）ライブラリ。意図しない更新を避けるため3.0.0に完全固定する
  JOSESwift:
    url: https://github.com/airsidemobile/JOSESwift
    exactVersion: 3.0.0
  # ネットワーク基盤ライブラリ。承認済みの2.105.0に完全固定する
  SwiftNIO:
    url: https://github.com/apple/swift-nio.git
    exactVersion: 2.105.0
targets:
  Melete:
    type: application
    platform: macOS
    sources:
      - path: Melete
    dependencies:
      - package: JOSESwift
      # SwiftNIOは複数productを持つため、使うproductを個別に指定する
      - package: SwiftNIO
        product: NIOCore
      - package: SwiftNIO
        product: NIOPosix
      - package: SwiftNIO
        product: NIOHTTP1
    settings:
      base:
        PRODUCT_NAME: Melete
        # Melete/Assets.xcassets/AppIcon.appiconset をアプリアイコンとして使う
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        WindowProbe:
          PRODUCT_BUNDLE_IDENTIFIER: jp.iorinu.Melete.UITesting
        ScratchProbe:
          PRODUCT_BUNDLE_IDENTIFIER: jp.iorinu.Melete.UITesting.Scratch
  MeleteTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MeleteTests
      # ScratchProbeの照合ロジックをUIテストと同じソースで単体テストする
      - path: TestsShared/ScratchEvidencePolicy.swift
    dependencies:
      - target: Melete
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.iorinu.MeleteTests
  MeleteUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: MeleteUITests
      - path: TestsShared/ScratchEvidencePolicy.swift
    dependencies:
      - target: Melete
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.iorinu.MeleteUITests
schemes:
  Melete:
    build:
      targets:
        Melete: all
        MeleteTests: [test]
        MeleteUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: MeleteTests
        - name: MeleteUITests
  Melete-WindowProbe:
    build:
      targets:
        Melete: all
        MeleteTests: [test]
        MeleteUITests: [test]
    run:
      config: WindowProbe
    test:
      config: WindowProbe
      targets:
        - name: MeleteTests
        - name: MeleteUITests
  # 全アクションをScratchProbe構成に固定する（省略するとprofile/archiveはRelease、analyzeはDebugになり通常ストアを開き得る）
  Melete-ScratchProbe:
    build:
      targets:
        Melete: all
        MeleteTests: [test]
        MeleteUITests: [test]
    run:
      config: ScratchProbe
    test:
      config: ScratchProbe
      targets:
        - name: MeleteTests
        - name: MeleteUITests
    profile:
      config: ScratchProbe
    analyze:
      config: ScratchProbe
    archive:
      config: ScratchProbe
